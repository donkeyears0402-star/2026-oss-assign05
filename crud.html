<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Simple CRUD Service</title>
</head>
<body>
  <h1>영화 감상 기록</h1>

  <form id="movieForm">
    <p>
      <label for="title">제목</label>
      <input type="text" id="title">
    </p>
    <p>
      <label for="director">감독</label>
      <input type="text" id="director">
    </p>
    <p>
      <label for="genre">장르</label>
      <select id="genre">
        <option value="">선택하세요</option>
        <option value="액션">액션</option>
        <option value="드라마">드라마</option>
        <option value="코미디">코미디</option>
        <option value="SF">SF</option>
        <option value="애니메이션">애니메이션</option>
      </select>
    </p>
    <p>
      <label for="year">개봉연도</label>
      <input type="number" id="year">
    </p>
    <p>
      <label for="rating">평점(1~5)</label>
      <input type="number" id="rating">
    </p>
    <button type="submit" id="saveBtn">저장</button>
  </form>

  <table border="1">
    <thead>
      <tr>
        <th>제목</th>
        <th>감독</th>
        <th>장르</th>
        <th>개봉연도</th>
        <th>평점</th>
        <th>관리</th>
      </tr>
    </thead>
    <tbody id="movieList"></tbody>
  </table>

  <a href="index.html">메인으로</a>

  <script>
    // 영화 데이터 (처음 3개)
    let movies = [
      { id: 1, title: "인터스텔라", director: "크리스토퍼 놀란", genre: "SF", year: 2014, rating: 5 },
      { id: 2, title: "기생충", director: "봉준호", genre: "드라마", year: 2019, rating: 4 },
      { id: 3, title: "인사이드 아웃 2", director: "켈시 맨", genre: "애니메이션", year: 2024, rating: 4 }
    ];

    let nextId = 4; // 다음에 추가할 영화 번호
    let editId = null; // 수정 중인 영화 id (null이면 추가)

    // Read: 배열에 있는 영화를 테이블에 출력
    function render() {
      const list = document.getElementById("movieList");
      list.innerHTML = ""; // 기존 내용 지우고 다시 그림

      movies.forEach(function (movie) {
        const tr = document.createElement("tr");

        const titleTd = document.createElement("td");
        titleTd.innerText = movie.title;
        tr.appendChild(titleTd);

        const directorTd = document.createElement("td");
        directorTd.innerText = movie.director;
        tr.appendChild(directorTd);

        const genreTd = document.createElement("td");
        genreTd.innerText = movie.genre;
        tr.appendChild(genreTd);

        const yearTd = document.createElement("td");
        yearTd.innerText = movie.year;
        tr.appendChild(yearTd);

        const ratingTd = document.createElement("td");
        ratingTd.innerText = movie.rating + "점";
        tr.appendChild(ratingTd);

        // 수정, 삭제 버튼
        const btnTd = document.createElement("td");
        const editBtn = document.createElement("button");
        editBtn.innerText = "수정";
        editBtn.addEventListener("click", function () {
          startEdit(movie.id);
        });
        const deleteBtn = document.createElement("button");
        deleteBtn.innerText = "삭제";
        deleteBtn.addEventListener("click", function () {
          deleteMovie(movie.id);
        });
        btnTd.appendChild(editBtn);
        btnTd.appendChild(deleteBtn);
        tr.appendChild(btnTd);

        list.appendChild(tr);
      });
    }

    // Create: 새 영화 추가
    function addMovie() {
      const movie = {
        id: nextId,
        title: document.getElementById("title").value,
        director: document.getElementById("director").value,
        genre: document.getElementById("genre").value,
        year: Number(document.getElementById("year").value),
        rating: Number(document.getElementById("rating").value)
      };

      movies.push(movie);
      nextId++;
    }

    // Update 1: 수정 버튼 누르면 폼에 원래 값 채우기
    function startEdit(id) {
      const movie = movies.find(function (m) {
        return m.id === id;
      });

      document.getElementById("title").value = movie.title;
      document.getElementById("director").value = movie.director;
      document.getElementById("genre").value = movie.genre;
      document.getElementById("year").value = movie.year;
      document.getElementById("rating").value = movie.rating;

      editId = id;
      document.getElementById("saveBtn").innerText = "수정 완료";
    }

    // Update 2: 배열에 있는 값 바꾸기
    function updateMovie() {
      const movie = movies.find(function (m) {
        return m.id === editId;
      });

      movie.title = document.getElementById("title").value;
      movie.director = document.getElementById("director").value;
      movie.genre = document.getElementById("genre").value;
      movie.year = Number(document.getElementById("year").value);
      movie.rating = Number(document.getElementById("rating").value);

      editId = null;
      document.getElementById("saveBtn").innerText = "저장";
    }

    // Delete: 영화 삭제
    function deleteMovie(id) {
      if (!confirm("삭제하시겠습니까?")) {
        return; // 취소 누르면 아무것도 안 함
      }

      // 몇 번째에 있는지 찾기
      const index = movies.findIndex(function (m) {
        return m.id === id;
      });

      movies.splice(index, 1); // 그 위치에서 1개 삭제

      // 수정 중이던 영화를 지웠으면 폼도 처음 상태로
      if (editId === id) {
        editId = null;
        document.getElementById("movieForm").reset();
        document.getElementById("saveBtn").innerText = "저장";
      }

      render();
    }

    window.onload = function () {
      render();

      const form = document.getElementById("movieForm");
      form.addEventListener("submit", function (event) {
        event.preventDefault(); // 새로고침 막기

        if (editId === null) {
          addMovie();
        } else {
          updateMovie();
        }
        render();
        form.reset(); // 입력칸 비우기
      });
    };
  </script>
</body>
</html>
